name: Diagnóstico de rede (gov.br)

# Workflow manual, temporário, para entender por que os runners do GitHub não
# alcançam o www.gov.br. Pode ser apagado depois do diagnóstico.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rede:
    name: Conectividade gov.br (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: DNS e curl (bash/curl)
        shell: bash
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "=== curl versão ==="
          curl --version | head -2
          echo "=== curl -4 google (controle) ==="
          curl -4 -sS -o /dev/null -w "google: %{http_code} em %{time_total}s\n" --max-time 15 https://www.google.com || echo "google falhou"
          echo "=== curl -4 gov.br raiz ==="
          curl -4 -sS -o /dev/null -w "gov.br: %{http_code} em %{time_total}s\n" --max-time 20 https://gov.br || echo "gov.br falhou"
          echo "=== curl -4 página ANP ==="
          curl -4 -sS -o /dev/null -w "pagina: %{http_code} em %{time_total}s (%{size_download} bytes)\n" --max-time 30 "https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/levantamento-de-precos-de-combustiveis-ultimas-semanas-pesquisadas" || echo "pagina falhou"
          echo "=== curl -4 XLSX da semana ==="
          curl -4 -sS -o /dev/null -w "xlsx: %{http_code} em %{time_total}s (%{size_download} bytes)\n" --max-time 30 "https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/arquivos-lpc/2026/resumo_semanal_lpc_2026_11_15_2026-11-21.xlsx" || echo "xlsx falhou"
          echo "=== curl -6 google/gov.br ==="
          curl -6 -sS -o /dev/null -w "google6: %{http_code} em %{time_total}s\n" --max-time 10 https://www.google.com || echo "google ipv6 falhou"
          curl -6 -sS -o /dev/null -w "govbr6: %{http_code} em %{time_total}s\n" --max-time 10 https://gov.br || echo "gov.br ipv6 falhou"

      - name: Node fetch + DNS
        shell: bash
        run: |
          node --input-type=module -e "
          import dns from 'node:dns/promises';
          const hosts = ['www.gov.br', 'gov.br', 'www.google.com'];
          for (const h of hosts) {
            try {
              const a = await dns.resolve4(h).catch(() => []);
              const aaaa = await dns.resolve6(h).catch(() => []);
              console.log(h, '| IPv4:', a.slice(0, 3), '| IPv6:', aaaa.slice(0, 2));
            } catch (e) { console.log(h, '| DNS erro:', e.code || e.message); }
          }
          const urls = [
            'https://www.gov.br/anp/',
            'https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/levantamento-de-precos-de-combustiveis-ultimas-semanas-pesquisadas'
          ];
          for (const u of urls) {
            const t = Date.now();
            try {
              const r = await fetch(u, { signal: AbortSignal.timeout(25000), headers: { 'user-agent': 'Mozilla/5.0' } });
              console.log('fetch', r.status, (Date.now() - t) + 'ms', u);
            } catch (e) {
              console.log('fetch ERRO', (Date.now() - t) + 'ms', u, '->', e.cause?.code || e.message);
            }
          }
          "
